name: TestFlight review retry
on:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
jobs:
  external-review-retry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: testflight
    steps:
      - uses: actions/checkout@v5
      - name: Retry latest external build review submission
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python3 scripts/ci/wait-testflight.py --retry-external-review
