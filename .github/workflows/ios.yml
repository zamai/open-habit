name: iOS
on:
  pull_request:
  push:
    branches: [main, testflight-dev]
    tags: ['v*']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      local_testflight:
        description: Build and upload TestFlight from the maintainer Mac
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    if: github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.local_testflight)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Test core, app, and widgets
        run: bash scripts/ci/test.sh
      - name: Upload test result
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/tests.xcresult
  testflight:
    if: github.event_name != 'pull_request' && github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.local_testflight) && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testflight-dev' || startsWith(github.ref, 'refs/tags/v'))
    needs: test
    concurrency:
      group: testflight-publish
      cancel-in-progress: false
    runs-on: macos-26
    timeout-minutes: 40
    environment: testflight
    steps:
      - uses: actions/checkout@v5
      - name: Archive and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          SIGNING_P12: ${{ secrets.SIGNING_P12 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          APP_PROFILE: ${{ secrets.APP_PROFILE }}
          WIDGET_PROFILE: ${{ secrets.WIDGET_PROFILE }}
        run: bash scripts/ci/publish.sh
  local-testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.local_testflight && github.ref == 'refs/heads/main'
    concurrency:
      group: testflight-publish
      cancel-in-progress: false
    runs-on: [self-hosted, macOS, ARM64, open-habit-local]
    timeout-minutes: 40
    environment: testflight
    steps:
      - uses: actions/checkout@v5
      - name: Archive and upload from maintainer Mac
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          SIGNING_P12: ${{ secrets.SIGNING_P12 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          APP_PROFILE: ${{ secrets.APP_PROFILE }}
          WIDGET_PROFILE: ${{ secrets.WIDGET_PROFILE }}
        run: bash scripts/ci/publish.sh
  external-review-retry:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: testflight
    steps:
      - uses: actions/checkout@v5
      - name: Retry latest external build review submission
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python3 scripts/ci/wait-testflight.py --retry-external-review
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: testflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Prepare GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --draft --generate-notes --title "$RELEASE_TAG"
          echo 'Test this build in TestFlight, then select it in App Store Connect for App Review.' >> "$GITHUB_STEP_SUMMARY"
