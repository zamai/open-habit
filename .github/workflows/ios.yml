name: iOS
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Test core, app, and widgets
        run: bash scripts/ci/test.sh
      - name: Upload test result
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/tests.xcresult
  testflight:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: test
    concurrency:
      group: testflight-publish
      cancel-in-progress: false
    runs-on: macos-26
    timeout-minutes: 40
    environment: testflight
    steps:
      - uses: actions/checkout@v5
      - name: Archive and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          SIGNING_P12: ${{ secrets.SIGNING_P12 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          APP_PROFILE: ${{ secrets.APP_PROFILE }}
          WIDGET_PROFILE: ${{ secrets.WIDGET_PROFILE }}
        run: bash scripts/ci/publish.sh
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: testflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Prepare GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --draft --generate-notes --title "$RELEASE_TAG"
          echo 'Test this build in TestFlight, then select it in App Store Connect for App Review.' >> "$GITHUB_STEP_SUMMARY"
