name: iOS
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      testflight_runner:
        description: Runner used for this manually triggered TestFlight build
        required: true
        default: github
        type: choice
        options:
          - github
          - maintainer-mac
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    if: github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.testflight_runner == 'maintainer-mac')
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Validate release automation
        run: |
          bash -n scripts/ci/publish.sh
          python3 -m py_compile scripts/ci/wait-testflight.py scripts/ci/submit-app-store.py
      - name: Test core, app, and widgets
        run: bash scripts/ci/test.sh
      - name: Upload test result
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/tests.xcresult
  testflight:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.testflight_runner == 'github') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-rc.'))
    needs: test
    concurrency:
      group: app-store-connect-publish
      cancel-in-progress: false
    runs-on: macos-26
    timeout-minutes: 40
    environment: testflight
    steps:
      - uses: actions/checkout@v5
      - name: Archive and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          SIGNING_P12: ${{ secrets.SIGNING_P12 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          APP_PROFILE: ${{ secrets.APP_PROFILE }}
          WIDGET_PROFILE: ${{ secrets.WIDGET_PROFILE }}
        run: bash scripts/ci/publish.sh
  app-store:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-rc.')
    needs: test
    concurrency:
      group: app-store-connect-publish
      cancel-in-progress: false
    runs-on: macos-26
    timeout-minutes: 40
    environment: app-store
    steps:
      - uses: actions/checkout@v5
      - name: Archive, upload, and submit for App Review
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          SIGNING_P12: ${{ secrets.SIGNING_P12 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          APP_PROFILE: ${{ secrets.APP_PROFILE }}
          WIDGET_PROFILE: ${{ secrets.WIDGET_PROFILE }}
        run: bash scripts/ci/publish.sh app-store
  local-testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.testflight_runner == 'maintainer-mac' && github.ref == 'refs/heads/main'
    concurrency:
      group: app-store-connect-publish
      cancel-in-progress: false
    runs-on: [self-hosted, macOS, ARM64, open-habit-local]
    timeout-minutes: 40
    environment: testflight
    steps:
      - uses: actions/checkout@v5
      - name: Archive and upload from maintainer Mac
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          SIGNING_P12: ${{ secrets.SIGNING_P12 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          APP_PROFILE: ${{ secrets.APP_PROFILE }}
          WIDGET_PROFILE: ${{ secrets.WIDGET_PROFILE }}
        run: bash scripts/ci/publish.sh
  external-review-retry:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: testflight
    steps:
      - uses: actions/checkout@v5
      - name: Retry latest external build review submission
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python3 scripts/ci/wait-testflight.py --retry-external-review
  rc-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-rc.')
    needs: testflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --prerelease --generate-notes --title "$RELEASE_TAG"
          echo 'This release candidate is available to every configured TestFlight group.' >> "$GITHUB_STEP_SUMMARY"
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-rc.')
    needs: app-store
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --generate-notes --title "$RELEASE_TAG"
          echo 'The matching build was submitted for App Review. Storefront timing follows the release mode configured in App Store Connect.' >> "$GITHUB_STEP_SUMMARY"
